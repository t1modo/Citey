name: Daily Citation Check

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 00:00 PST (standard time, UTC-8)
    - cron: "0 7 * * *"   # 07:00 UTC = 00:00 PDT (daylight time, UTC-7)
  workflow_dispatch:       # allow manual runs from the GitHub Actions UI

# Never run two copies at once (e.g. a manual dispatch overlapping the
# schedule); a second run waits for the first to finish.
# The group name is versioned: run #184 (Nov 4) got stuck as a ghost that
# GitHub can neither cancel nor start, and it held the old group's slot, so
# every later run waited behind it. A new name sidesteps it.
concurrency:
  group: daily-citation-check-v2
  cancel-in-progress: false

jobs:
  run-citation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── Step 0: DST guard ─────────────────────────────────────────────────
      # Two crons fire daily; only the one that is midnight Pacific today should
      # run. Decide by which cron fired, not by the clock: GitHub often starts
      # scheduled runs 30 to 90 minutes late, and a late start used to fail an
      # "is it 00:xx Pacific?" check and skip the night silently.
      # PST (UTC-8): the 08:00 UTC cron is midnight. PDT (UTC-7): the 07:00 one.
      # Manual dispatches always proceed.
      - name: Check Pacific midnight
        id: time_check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch, skipping DST check."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          OFFSET=$(TZ="America/Los_Angeles" date +%z)
          echo "Cron: $SCHEDULE  Pacific offset: $OFFSET  Pacific time: $(TZ=America/Los_Angeles date +%H:%M)"
          if { [ "$OFFSET" = "-0800" ] && [ "$SCHEDULE" = "0 8 * * *" ]; } || \
             { [ "$OFFSET" = "-0700" ] && [ "$SCHEDULE" = "0 7 * * *" ]; }; then
            echo "This cron is midnight Pacific today. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "The other cron is midnight Pacific today. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Check out the batch runner script
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # ── Step 1: Check the API is up ───────────────────────────────────────
      # Ping the health endpoint and wait for a 200 before starting, so a
      # deploy in progress delays the run instead of failing it.
      - name: Check the API is up
        if: steps.time_check.outputs.skip != 'true'
        run: |
          echo "Resolving www.citey.email..."
          nslookup www.citey.email || { echo "ERROR: DNS resolution failed for www.citey.email"; exit 1; }

          echo "Pinging https://www.citey.email/api/health ..."
          for i in $(seq 1 8); do
            # -s silences the progress meter; -S still prints errors to the log.
            # On a failed connection -w prints "000". The job
            # runs with bash -e, so a timed out curl used to end the job on the
            # first attempt; "|| true" keeps it a retry.
            STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" --max-time 90 https://www.citey.email/api/health) || true
            echo "  attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Instance is awake."
              break
            fi
            if [ "$i" = "8" ]; then
              echo "ERROR: Instance did not respond after 8 attempts."
              exit 1
            fi
            sleep 15
          done

      # ── Step 2: Brief pause so any in-flight startup tasks can settle ──────
      - name: Wait for startup to settle
        if: steps.time_check.outputs.skip != 'true'
        run: sleep 5

      # ── Step 3: Run the citation check in batches ─────────────────────────
      # Each request checks users for at most ~200 s and returns a cursor;
      # the script repeats until every user is done. That keeps each request
      # inside Vercel Hobby's 300 s limit.
      - name: Run citation check
        if: steps.time_check.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: .github/scripts/run-batched-job.sh https://www.citey.email /api/jobs/run

      # ── Step 4: Delete notifications older than 30 days ───────────────────
      # Formerly an in-process APScheduler job (01:00 PT), which rarely fired
      # because the server slept between requests. Production now runs with
      # DISABLE_SCHEDULER=true, so every scheduled job is driven from here.
      - name: Clean up old notifications
        if: steps.time_check.outputs.skip != 'true'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"dry_run": false}' \
            https://www.citey.email/api/jobs/cleanup-notifications)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $(echo "$RESPONSE" | head -n -1)"
          [ "$HTTP_CODE" = "200" ] || { echo "ERROR: cleanup failed"; exit 1; }

      # ── Step 5: Weekly publication sync (Sundays, Pacific time) ───────────
      # Adds new papers from each user's linked author profile. Manual
      # dispatches run it too so it can be triggered on demand.
      - name: Sync new publications
        if: steps.time_check.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DOW=$(TZ="America/Los_Angeles" date +%u)   # 7 = Sunday
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DOW" != "7" ]; then
            echo "Not Sunday in Pacific time (day $DOW). Skipping publication sync."
            exit 0
          fi
          .github/scripts/run-batched-job.sh https://www.citey.email /api/jobs/sync-publications
