name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (uv + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Same uv as the backend Docker image.
          version: "0.9.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Fails if pyproject.toml changed without `uv lock`.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
