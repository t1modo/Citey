name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (uv + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres 18 (Neon's version) for the schema tests.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: citey
          POSTGRES_PASSWORD: citey
          POSTGRES_DB: citey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citey -d citey_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://citey:citey@localhost:5432/citey_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Same uv as the backend Docker image.
          version: "0.9.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Fails if pyproject.toml changed without `uv lock`.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      # Fails if app/db_models.py changed without a migration.
      - name: Check migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic check

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
