name: Keep Scheduled Workflows Alive

# GitHub disables scheduled workflows after 60 days without repository
# activity. That silently stopped the daily citation check from August to
# November 2026. Re-enabling a workflow through the API resets that timer,
# so this runs twice a month and re-enables both the daily check and itself.
# No commits are made.

on:
  schedule:
    - cron: "17 15 1,15 * *"   # 1st and 15th of each month, 15:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily-citation-check.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            STATE=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf" --jq .state)
            echo "$wf: $STATE"
            [ "$STATE" = "active" ] || { echo "ERROR: $wf is $STATE"; exit 1; }
          done
