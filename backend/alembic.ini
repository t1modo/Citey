# Alembic: Postgres schema migrations. Run from backend/:
#
#   uv run alembic upgrade head                              # apply all
#   uv run alembic revision --autogenerate -m "add x to y"   # after editing app/db_models.py
#   uv run alembic check                                     # fails if models and migrations differ
#
# The database comes from DATABASE_URL_UNPOOLED, else DATABASE_URL (see
# migrations/env.py), so it is never written in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
