[project]
name = "citey-backend"
version = "0.1.0"
description = "Citey API: emails researchers when a new paper cites theirs."
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.5.0",
    "apscheduler==3.11.3",
    "cachetools==5.5.2",
    "fastapi==0.162.0",
    "firebase-admin==6.9.0",
    "httpx==0.28.1",
    "inngest==0.5.20",
    "jinja2==3.1.6",
    "psycopg[binary]>=3.2",
    "pydantic==2.14.2",
    "pydantic-settings==2.6.1",
    "pyjwt[crypto]>=2.9",
    "pypdf==4.3.1",
    "python-dotenv==1.2.4",
    "pytz==2024.2",
    "resend==2.51.0",
    "sqlalchemy[asyncio]==2.1.8",
    "sqlmodel[asyncio]==0.0.48",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "respx==0.23.1",
]

# The code is the app package in src/app. uv installs it (editable
# locally, as a wheel in Docker and on Vercel), so `import app` works from
# tests, scripts, Alembic and uvicorn alike.
[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"

[tool.uv]
package = true
# Rebuild the installed wheel whenever the code changes, not only when this
# file does. Without this, uv reuses its cached build of the project, and
# Docker and Vercel (which both keep uv's cache) can ship old code.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "uv.lock" },
    { file = "src/**/*" },
]

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["real_extra_sources: use the real OpenCitations and Europe PMC clients (mock HTTP yourself)"]
testpaths = ["tests"]
