[project]
name = "citey-backend"
version = "0.1.0"
description = "Citey API: emails researchers when a new paper cites theirs."
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.5.0",
    "apscheduler==3.11.3",
    "cachetools==5.5.2",
    "fastapi==0.162.0",
    "firebase-admin==6.9.0",
    "httpx==0.28.1",
    "inngest==0.5.20",
    "jinja2==3.1.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.6.1",
    "pypdf==4.3.1",
    "python-dotenv==1.2.4",
    "pytz==2024.2",
    "resend==2.51.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "respx==0.23.1",
]

# An app, not a library: uv installs the dependencies but never builds or
# installs the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["real_extra_sources: use the real OpenCitations and Europe PMC clients (mock HTTP yourself)"]
testpaths = ["tests"]
