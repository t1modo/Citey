# Run the API and the site locally:
#
#   cp backend/.env.example backend/.env           # Clerk keys, Resend, secrets
#   cp frontend/.env.example frontend/.env.local   # Clerk publishable key
#   docker compose up --build
#
# Site: http://localhost:3000   API: http://localhost:8000/api
# Inngest Dev Server (scheduled jobs): http://localhost:8288
# Postgres: localhost:5432, user/password/database citey

services:
  # Local Postgres 18, the same major version as the Neon project. The
  # backend uses it instead of whatever DATABASE_URL backend/.env sets, so
  # local work never touches Neon. Data lives in the pgdata volume
  # (`docker compose down -v` wipes it).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: citey
      POSTGRES_PASSWORD: citey
      POSTGRES_DB: citey
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Also creates citey_test, for TEST_DATABASE_URL.
      - ./backend/scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citey -d citey"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Brings the schema up to date, then exits; the backend starts after it.
  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://citey:citey@postgres:5432/citey
      DATABASE_URL_UNPOOLED: ""
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://citey:citey@postgres:5432/citey
      DATABASE_URL_UNPOOLED: ""
      # Links in emails and the CORS allow-list point at this local stack.
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
      # Jobs run through the Dev Server below, never Inngest Cloud. Over the
      # Compose network it is at inngest:8288, not localhost.
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Runs the nightly and weekly jobs locally. Crons fire on their schedule;
  # to run one now, open http://localhost:8288, pick the function and
  # Invoke it. The functions use the local Postgres above.
  inngest:
    image: inngest/inngest
    command: inngest dev -u http://backend:8000/api/inngest
    ports:
      - "8288:8288"
      - "8289:8289"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      secrets:
        - frontend_env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  # NEXT_PUBLIC_* values are compiled into the site, so the build reads them.
  # Keep NEXT_PUBLIC_API_URL=http://localhost:8000/api: the browser calls the
  # API through the published port, not the Compose network.
  frontend_env:
    file: ./frontend/.env.local
