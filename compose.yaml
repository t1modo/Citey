# Run the API and the site locally:
#
#   cp backend/.env.example backend/.env           # Firebase service account etc.
#   cp frontend/.env.example frontend/.env.local   # Firebase web config
#   docker compose up --build
#
# Site: http://localhost:3000   API: http://localhost:8000/api

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Links in emails and the CORS allow-list point at this local stack.
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      secrets:
        - frontend_env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

secrets:
  # NEXT_PUBLIC_* values are compiled into the site, so the build reads them.
  # Keep NEXT_PUBLIC_API_URL=http://localhost:8000/api: the browser calls the
  # API through the published port, not the Compose network.
  frontend_env:
    file: ./frontend/.env.local
